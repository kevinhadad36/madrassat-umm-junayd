<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette de l'administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#fbf5ee; --carte:#fffdf9; --bord:#f0e6d8; --ombre:0 6px 18px rgba(120,90,60,.08);
  --encre:#2b2333; --doux:#6f625a; --titre:#163d2c; --vert:#1d4f37; --vert2:#2c6a45; --bordeaux:#5a1f3a;
  --rose:#fbe6ea; --rose-b:#f4ccd5; --rose-t:#c4566e;
  --orange:#fdf0dc; --orange-b:#f5d9ae; --orange-t:#c27a12;
  --vertp:#eaf3e2; --vertp-b:#d3e6c1; --vertp-t:#3f8a3a;
  --bleu:#e6f1f8; --bleu-b:#c9e0ef; --bleu-t:#2f7aa8;
  --violet:#f2eaf8; --violet-b:#dfcff0; --violet-t:#8656b8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--encre);font-family:Nunito,system-ui,sans-serif;font-weight:700;line-height:1.35}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2.serif{font-family:Fraunces,Georgia,serif;font-weight:700}
.bandeau{background:#fff3c4;border:1.5px solid #f2d77a;border-radius:12px;color:#6b4e00;text-align:center;font-size:13px;padding:6px 12px;margin-bottom:16px}
.app{display:flex;min-height:100vh}
/* Menu latéral */
.menu{width:270px;flex-shrink:0;background:linear-gradient(180deg,#1d5139 0%,#174430 100%);color:#fff;padding:20px 14px 0;position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.marque{text-align:center;margin-bottom:18px}
.marque .logo{background:#fffaf0;border-radius:22px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.marque img{display:block;width:100%;height:auto}
.marque span{display:inline-block;margin-top:12px;background:#f7ebcf;color:var(--vert);font-size:13px;font-weight:800;padding:5px 16px;border-radius:999px}
.menu nav a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;text-decoration:none;font-size:16px;font-weight:700;color:#eef5ee;margin-bottom:4px}
.menu nav a:hover{background:rgba(255,255,255,.07)}
.menu nav a.actif{background:#fbe8c4;color:var(--vert);font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.menu nav svg{width:22px;height:22px;flex-shrink:0}
.deco{margin-top:auto;position:relative;height:170px;pointer-events:none}
.deco svg{position:absolute;left:-14px;right:-14px;bottom:0;width:calc(100% + 28px);height:100%}
/* Zone principale */
.principal{flex:1;min-width:0;padding:26px 30px 56px;position:relative}
.entete{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.entete h1{margin:0;font-size:clamp(1.7rem,1.3rem+1.4vw,2.5rem);color:var(--titre);line-height:1.1}
.entete p{margin:4px 0 0;color:var(--doux);font-size:16px;font-weight:600}
.entete .droite{margin-left:auto;display:flex;gap:10px;align-items:center}
.rond{width:46px;height:46px;border-radius:999px;background:var(--carte);border:1.5px solid var(--bord);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center;position:relative}
.rond .point{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:99px;background:#ef7f94;border:2px solid #fff}
.profil{display:flex;align-items:center;gap:10px;background:var(--carte);border:1.5px solid var(--bord);box-shadow:var(--ombre);border-radius:999px;padding:5px 14px 5px 5px;position:relative}
.profil .av{width:36px;height:36px;border-radius:999px;background:#e9e1d8;display:flex;align-items:center;justify-content:center}
.profil b{display:block;font-size:14.5px}.profil small{display:block;font-size:12.5px;color:var(--doux);font-weight:600}
.deroule{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--carte);border:1.5px solid var(--bord);border-radius:16px;box-shadow:var(--ombre);min-width:200px;padding:6px;z-index:5}
.deroule a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14.5px}
.deroule a:hover{background:var(--fond)}
.profil.ouvert .deroule{display:block}
.ouvrir{display:none}
.grille{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.carte{background:var(--carte);border:1.5px solid var(--bord);border-radius:24px;box-shadow:var(--ombre);padding:18px 20px}
.chiffre{display:flex;align-items:center;gap:16px;border-radius:24px;padding:20px;border:1.5px solid;box-shadow:var(--ombre);position:relative;overflow:hidden}
.chiffre .ic{width:50px;height:50px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chiffre .ic svg{width:40px;height:40px}
.chiffre b{display:block;font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:700;line-height:1}
.chiffre small{display:block;font-size:15px;color:var(--encre);margin-top:4px;font-weight:700}
.parcours{position:relative;overflow:hidden;border-radius:26px;border:1.5px solid;box-shadow:var(--ombre);padding:22px 22px 0;min-height:230px;text-decoration:none;display:block}
.parcours .haut{display:flex;align-items:flex-start;gap:16px;position:relative;z-index:1}
.parcours .bulle{width:84px;height:84px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.parcours .bulle svg{width:44px;height:44px}
.parcours h2{margin:6px 0 0;font-family:Fraunces,Georgia,serif;font-size:clamp(1.3rem,1.1rem+.8vw,1.75rem);line-height:1.15}
.parcours p{margin:6px 0 0;font-size:15.5px;font-weight:600}
.parcours .fl{margin-left:auto;width:44px;height:44px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--ombre);flex-shrink:0}
.parcours .vague{position:absolute;left:0;right:0;bottom:0;height:120px}
.parcours .illu{position:absolute;right:28px;bottom:10px;width:170px;height:auto;z-index:1}
.titre-carte{display:flex;align-items:center;gap:14px}
.titre-carte h2{margin:0;font-size:22px;font-weight:900;color:var(--bordeaux)}
.titre-carte .ic{width:34px;height:34px;color:#d08a1e;flex-shrink:0}
.liste{list-style:none;margin:12px 0 0;padding:0}
.liste li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1.5px solid #f3ebdf;font-size:16px}
.liste li:first-child{border-top:0}
.liste .q{margin-left:auto;color:var(--doux);font-size:14.5px;white-space:nowrap;font-weight:600}
.liste .pers{width:24px;height:24px;color:var(--vert2);flex-shrink:0}
.liste a{display:flex;align-items:center;gap:12px;width:100%;text-decoration:none}
.nb{min-width:44px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
.ic-rond{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-rond svg{width:22px;height:22px}
.tag{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.t-auto{background:var(--vertp);color:#2f5f2c;border:1px solid var(--vertp-b)}
.t-acc{background:var(--rose);color:#9c3550;border:1px solid var(--rose-b)}
.t-ok{background:#e3f4e4;color:#2f7a3a}
.t-att{background:#fff0d6;color:#a86200}
.t-ko{background:#fde4e4;color:#c03434}
.t-gris{background:#f1ece2;color:#6b5e55}
.lien{color:var(--vert2);font-weight:800;text-decoration:none;font-size:15px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--vert2);color:#fff;border:0;border-radius:14px;padding:11px 18px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #1c4a2f;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.clair{background:var(--carte);color:var(--vert);border:1.5px solid var(--bord);box-shadow:var(--ombre)}
.onglets{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.onglets button{border:1.5px solid var(--bord);background:var(--carte);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14.5px}
.onglets button.actif{background:var(--vert2);border-color:var(--vert2);color:#fff}
.outils{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.outils input,.outils select{border:1.5px solid var(--bord);background:var(--carte);border-radius:14px;padding:10px 14px;font:inherit;font-size:15px;font-weight:600;min-width:0}
.outils input{flex:1 1 240px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--doux);font-size:13px;font-weight:800;padding:8px 12px;border-bottom:1.5px solid var(--bord);white-space:nowrap}
td{padding:12px;border-bottom:1.5px solid #f3ebdf;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clic{cursor:pointer}
tr.clic:hover td{background:#fdf8f1}
.tableau{overflow-x:auto;padding:8px 10px}
.groupe{border-radius:22px;border:1.5px solid;padding:16px 18px;box-shadow:var(--ombre)}
.groupe h3{margin:0;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.groupe .h{font-size:14.5px;color:var(--doux);margin-top:3px;font-weight:600}
.places{margin-left:auto;font-size:13px;font-weight:800;background:#fff;border-radius:999px;padding:4px 11px}
.eleves{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.eleves span{background:#fff;border-radius:999px;padding:5px 11px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.eleves span i{font-style:normal;color:var(--doux);font-size:12px}
.actions-g{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.actions-g button{background:#fff;border:1.5px solid rgba(0,0,0,.07);border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800}
.semaine{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;margin-bottom:12px}
.semaine .j{font-weight:900;padding-top:10px}
.creneaux{display:flex;flex-wrap:wrap;gap:10px}
.creneau{border-radius:16px;border:1.5px solid;padding:10px 14px;font-size:14px;min-width:170px;font-weight:600}
.creneau b{display:block;font-size:15px;font-weight:900}
.note{background:#f1f7e9;border:1.5px dashed #c9e2ad;border-radius:18px;padding:13px 16px;font-size:14.5px;color:#3d5a26;font-weight:600;margin-top:16px}
.note.att{background:#fff8e8;border-color:#f0d78f;color:#6b4e00}
.barres{display:flex;align-items:flex-end;gap:14px;height:170px;padding:24px 6px 0;border-bottom:1.5px solid var(--bord)}
.barres div{flex:1;border-radius:10px 10px 0 0;background:#bfdea0;position:relative}
.barres div span{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:13px}
.axe{display:flex;gap:14px;padding:6px 6px 0}
.axe span{flex:1;text-align:center;font-size:12.5px;color:var(--doux)}
.repart{height:20px;border-radius:999px;overflow:hidden;display:flex;margin:14px 0 10px}
.lignes div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1.5px solid #f3ebdf;font-size:15px}
.lignes div:first-child{border-top:0}
.lignes span{color:var(--doux);font-weight:600}
.retour{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--vert2);font-weight:800;font-size:15px;margin-bottom:14px}
.enfant{border-radius:22px;border:1.5px solid;padding:16px 18px;box-shadow:var(--ombre)}
.enfant .tete{display:flex;align-items:center;gap:12px}
.enfant .av{width:48px;height:48px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0}
.enfant h3{margin:0;font-size:19px;font-weight:900}
.enfant .sous{font-size:14px;color:var(--doux);font-weight:600}
.enfant .lignes{margin-top:10px;background:rgba(255,255,255,.65);border-radius:14px;padding:2px 12px}
.enfant .lignes div{font-size:14px;padding:8px 0}
.mini-btn{background:#fff;border:1.5px solid var(--bord);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:800;text-decoration:none;display:inline-block}
.titre-section{font-size:20px;font-weight:900;margin:26px 0 12px;color:var(--titre)}
.fond-vague{position:fixed;left:270px;right:0;bottom:0;height:90px;pointer-events:none;z-index:-1}
.calque{display:none}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .menu{position:fixed;z-index:30;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  body.menu-ouvert .menu{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.2)}
  body.menu-ouvert .calque{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:20}
  .ouvrir{display:flex}
  .principal{padding:16px 16px 48px}
  .g2{grid-template-columns:1fr}
  .profil .txt{display:none}
  .profil{padding:5px}
  .semaine{grid-template-columns:1fr}
  .fond-vague{left:0}
  .entete .droite{order:-1;margin-left:auto}
  .entete .ouvrir{order:-2;margin-right:auto}
  .entete .bloc{flex-basis:100%}
}
@media (max-width:520px){
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .chiffre{padding:14px;gap:8px;flex-direction:column;align-items:flex-start}
  .chiffre b{font-size:28px}.chiffre small{font-size:14px}
  .chiffre .ic{width:auto;height:auto}.chiffre .ic svg{width:32px;height:32px}
  .parcours{min-height:210px;padding:18px 16px 0}
  .parcours .bulle{width:60px;height:60px}.parcours .bulle svg{width:32px;height:32px}
  .parcours .illu{width:120px;right:14px}
  .creneau{min-width:0;flex:1 1 100%}
  .enfants-g{grid-template-columns:1fr}
  .liste li{font-size:15px}
  table.fiches thead{display:none}
  table.fiches tr{display:block;border:1.5px solid var(--bord);border-radius:18px;padding:8px 12px;margin-bottom:10px;background:var(--carte)}
  table.fiches td{display:flex;justify-content:space-between;gap:10px;border:0;padding:6px 0}
  table.fiches td::before{content:attr(data-l);color:var(--doux);font-size:13px;font-weight:600}
  .tableau{padding:0;background:none;border:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="calque" onclick="document.body.classList.remove('menu-ouvert')"></div>
<svg class="fond-vague" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50 C200 10 380 80 600 45 S1000 20 1200 55 V90 H0z" fill="#f6e7d3" opacity=".7"/></svg>
<div class="app">
  <aside class="menu" id="menu">
    <div class="marque">
      <div class="logo"><img src="logo-officiel.webp" alt="La Madrassa d'Umm Junayd" width="640" height="362"></div>
      <span>Espace administrateur</span>
    </div>
    <nav id="nav"></nav>
    <div class="deco" aria-hidden="true">
      <svg viewBox="0 0 300 170" preserveAspectRatio="xMidYMax meet">
        <path d="M0 140 C60 110 120 150 180 130 S270 110 300 120 V170 H0z" fill="#f3c9cf" opacity=".9"/>
        <g fill="#f7dcb4"><path d="M95 170V110c0-30 25-46 55-62 30 16 55 32 55 62v60z"/><rect x="138" y="30" width="24" height="12" rx="6"/></g>
        <path d="M150 20a8 8 0 1 0 6 13 10 10 0 1 1-6-13z" fill="#f7ebcf"/>
        <g fill="#f0c98f"><rect x="118" y="130" width="14" height="40" rx="7"/><rect x="143" y="122" width="14" height="48" rx="7"/><rect x="168" y="130" width="14" height="40" rx="7"/></g>
        <g fill="#a9c97a"><path d="M30 170c0-40 10-70 28-88-4 30-10 60-28 88z"/><path d="M48 170c8-30 26-50 44-58-12 22-24 42-44 58z"/><path d="M270 170c0-40-10-70-28-88 4 30 10 60 28 88z"/><path d="M252 170c-8-30-26-50-44-58 12 22 24 42 44 58z"/></g>
      </svg>
    </div>
  </aside>
  <main class="principal"><div class="bandeau">Maquette finale · les noms et les chiffres sont des <b>exemples</b>, pas les vraies données</div><div id="page"></div></main>
</div>
<script>
const I={
 maison:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 groupe:'<circle cx="8.5" cy="8" r="3.2"/><circle cx="16.5" cy="8.5" r="2.8"/><path d="M2.5 19.5c.4-3.6 2.9-5.6 6-5.6s5.6 2 6 5.6zM14.6 14.3c3-.6 6.3 1 6.9 5.2h-5.3"/>',
 ordi:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
 carte:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/>',
 stats:'<path d="M5 20v-7M10 20V6M15 20v-9M20 20V9"/>',
 reglage:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"/>',
 dossier:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 11h.01M11 11h5M8.5 15h.01M11 15h5"/>',
 cloche:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
 lune:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 pers:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-3.8 3.4-6 7-6s6.4 2.2 7 6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 fleche:'<path d="m9 6 6 6-6 6"/>',
 gauche:'<path d="m15 6-6 6 6 6"/>',
 bas:'<path d="m6 9 6 6 6-6"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 livre:'<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/>',
 micro:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
 feuille:'<path d="M5 19C5 10 11 5 20 4c0 9-5 15-14 15z"/><path d="M5 19 13 11"/>'
};
const svg=(k,c='currentColor',w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
const plein=(k,c)=>`<svg viewBox="0 0 24 24" fill="${c}" stroke="${c}" stroke-width="1" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
const RUB=[['tableau','Tableau de bord','maison'],['accompagne','Parcours accompagné','groupe'],['autonome','Parcours autonome','ordi'],['paiements','Abonnements & paiements','carte'],['stats','Statistiques','stats'],['cours','Supports de cours','livre'],['parametres','Paramètres','reglage']];
const P={rose:['var(--rose)','var(--rose-b)','var(--rose-t)'],orange:['var(--orange)','var(--orange-b)','var(--orange-t)'],vert:['var(--vertp)','var(--vertp-b)','var(--vertp-t)'],bleu:['var(--bleu)','var(--bleu-b)','var(--bleu-t)'],violet:['var(--violet)','var(--violet-b)','var(--violet-t)']};
const tag=(t,k)=>`<span class="tag ${k}">${t}</span>`;
const parcours=a=>a?tag('Parcours autonome','t-auto'):tag('Parcours accompagné','t-acc');
const chiffre=(n,l,ic,c,remplir=true)=>`<div class="chiffre" style="background:linear-gradient(135deg,${P[c][0]},#fffdf9 140%);border-color:${P[c][1]}"><span class="ic" style="color:${P[c][2]}">${remplir?plein(ic,P[c][2]):svg(ic,P[c][2],2.2)}</span><span><b>${n}</b><small>${l}</small></span></div>`;

};

const MENU_DE={inscriptions:'tableau',famille:'autonome'};
function nav(id){document.getElementById('nav').innerHTML=RUB.map(([k,t,ic])=>`<a href="#${k}" class="${k===id?'actif':''}">${svg(ic)}<span>${t}</span></a>`).join('')}
function aller(){
  const [id,arg]=(location.hash.slice(1)||'tableau').split('/');
  const f=PAGES[id]?id:'tableau';
  nav(MENU_DE[f]||f);
  document.getElementById('page').innerHTML=PAGES[f](arg);
  document.querySelectorAll('[data-o]').forEach(o=>o.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;o.querySelectorAll('button').forEach(x=>x.classList.remove('actif'));b.classList.add('actif');if(b.dataset.v)document.querySelectorAll('[data-vue]').forEach(v=>v.hidden=v.dataset.vue!==b.dataset.v)}));
  document.body.classList.remove('menu-ouvert');
  window.scrollTo(0,0);
}
addEventListener('hashchange',aller);aller();
